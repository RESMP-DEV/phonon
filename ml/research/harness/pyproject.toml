[project]
name = "phonon-research"
version = "0.1.0"
description = "Config-driven research flywheel for phonon: corpus, train, eval, queue."
requires-python = ">=3.12,<3.13"
dependencies = [
  # training (versions the bigrun/pool2/pool3 chains actually ran with on gpubox 2026-09-20)
  "torch==2.14.0",
  "transformers==5.9.0",
  "peft==0.20.0",
  "trl==1.13.0",
  "accelerate==1.15.0",
  "datasets==4.8.5",
  "jiwer==3.1.0",
  "whisper-normalizer==0.1.15",
  # retrieval (vocab_v1 Retriever, retrieval_v2 RetrieverV2)
  "rapidfuzz==3.14.5",
  "metaphone==0.6",
  "g2p-en==2.1.0",
  "numpy==1.26.4",
  # corpus: TTS. misaki (kokoro's g2p) loads the spaCy model by name, and installing it at
  # first use races the worker processes, so it is pinned here instead.
  "kokoro==0.9.4",
  "soundfile==0.13.1",
  "scipy==1.17.1",
  "en-core-web-sm==3.8.0",
  # harness
  "pyyaml==6.0.3",
]

[project.scripts]
phonon-research = "phonon_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phonon_research"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
