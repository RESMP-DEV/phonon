# Numerics check: rebuild the first 2,000 rows of the shipped train_mid.jsonl through the
# harness modules and diff them field by field against the originals.
name: bigrun_mid_verify
out_dir: /data/phonon_harness/bigrun_mid_verify
lexicon: /data/phonon_synth_v0/lexicon_ranked.jsonl
heldout:
  - /data/phonon_term_eval_v0/terms_heldout.jsonl
  - /data/phonon_bigrun_v0/terms_heldout_new.jsonl
stages: [verify]
mix:
  topk: 30
  p_noline: 0.20
  p_restraint: 0.30
  seed: 918
  acoustic:
    pool: /data/phonon_bigrun_v0/acoustic_pool.jsonl
    lists: /data/phonon_bigrun_v0/lists_acoustic.jsonl
    seed_tag: v1ac
    source: tts_parakeet
  real:
    rows: /data/phonon_corrector_v0/datesplit/train_date.jsonl
    lists: /data/phonon_bigrun_v0/lists_real.jsonl
    seed_tag: v1real
    repeats: 4
  verify:
    reference: /data/phonon_bigrun_v0/train_mid.jsonl
    rows: 2000
