[project]
name = "phonon"
version = "0.1.0"
description = "Local-first ASR benchmark and dataset harness for developer dictation."
requires-python = ">=3.11,<3.13"
dependencies = [
  "datasets>=3.0.0",
  "huggingface-hub>=0.25.0",
  "jiwer>=3.0.4",
  "numpy>=1.26",
  "orjson>=3.10",
  "pyarrow>=16.0.0",
  "pyyaml>=6.0",
  "soundfile>=0.12.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
nemo = [
  "nemo_toolkit[asr]",
  "dill==0.3.8",
  "multiprocess<0.70.17",
  "torch",
  "torchaudio",
]
whisper = [
  "openai-whisper",
]
transformers-asr = [
  "accelerate",
  "librosa",
  "protobuf",
  "sentencepiece",
  "torch",
  "transformers>=5.4.0",
]

[project.scripts]
phonon = "phonon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "websockets>=16.0",
]
