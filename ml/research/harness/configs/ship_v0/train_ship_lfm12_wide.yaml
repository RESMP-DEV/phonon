# Wide-vocabulary ship candidate: ship_lfm12_v0 continued on the pool-2 rows (the xl recipe).
kind: train
name: ship_lfm12_wide_v0
model: LiquidAI/LFM2.5-1.2B-Instruct
train: /data/phonon_harness/ship_wide/train_wide.jsonl
dev: /data/phonon_corrector_v0/dev.jsonl
init_adapter: /data/phonon_corrector_v0/adapters/ship_lfm12_v0
epochs: 1
max_seconds: 3600   # wall cap, as bigrun_xl_r16 itself used: this train is the tail of the
                    # critical path and the box lost 25 minutes to an eviction at 21:46.
lr: 1.0e-4
lora_r: 16
lora_dropout: 0.05
batch_size: 16
max_seq_len: 1024
dataloader_workers: 4
group_by_length: "on"
corpus: ship_wide (pool2 acoustic + 25pc pool1 replay + train_date x8)
