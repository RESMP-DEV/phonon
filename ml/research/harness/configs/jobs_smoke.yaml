# Validation queue: two 2,000-row smoke trains, then one eval each.
# gpus is the pool the scheduler fills; `gpu: any` takes the first free slot.
# 2026-09-21: pinned to GPU 1 because GPU 0 was busy with the sibling benchmark run.
run: harness_smoke
agent: opus-harness
gpus: [1]
slots_per_gpu: 1
max_attempts: 2
jobs:
  - {name: train_a, kind: train, gpu: any, config: research/harness/configs/train_smoke_a.yaml}
  - {name: train_b, kind: train, gpu: any, config: research/harness/configs/train_smoke_b.yaml}
  - {name: eval_a, kind: eval, gpu: any, needs: [train_a], timeout_s: 900, config: research/harness/configs/eval_smoke_a.yaml}
  - {name: eval_b, kind: eval, gpu: any, needs: [train_b], timeout_s: 900, config: research/harness/configs/eval_smoke_b.yaml}
