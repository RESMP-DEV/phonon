# The bigrun_v0 mid corpus, as a config. Stages `pool`, `lists`, `mix` reproduce
# step5a_pool.py, step5b_lists.py and step5c_mix.py; `sentences`/`jobs`/`tts`/`asr` above them
# reproduce run_gen.sh, make_jobs.py, run_tts.sh and run_asr.sh.
name: bigrun_mid
out_dir: /data/phonon_harness/bigrun_mid
lexicon: /data/phonon_synth_v0/lexicon_ranked.jsonl
heldout:
  - /data/phonon_term_eval_v0/terms_heldout.jsonl
  - /data/phonon_bigrun_v0/terms_heldout_new.jsonl
stages: [pool, lists, mix]

sentences:
  terms: /data/phonon_bigrun_v0/terms_pool.jsonl
  per_term: 8
  rounds: 10
  batch_size: 128
  seed: 918
  gpu: 1

jobs:
  terms: /data/phonon_bigrun_v0/terms_pool.jsonl
  sentences: /data/phonon_harness/bigrun_mid/sentences.jsonl
  halves: 2
  stages:
    mid: {sidx: [0, 4], voice_offset: 0, n_voices: 3}
    big: {sidx: [4, 8], voice_offset: 3, n_voices: 3}

tts:
  workers: 7
  shards: [{stage: mid, half: 0, gpu: 1}, {stage: mid, half: 1, gpu: 1}]

asr:
  batch_size: 96
  shards: [{stage: mid, half: 0, gpu: 1}, {stage: mid, half: 1, gpu: 1}]

pool:
  asr:
    - /data/phonon_bigrun_v0/asr_mid_half0.jsonl
    - /data/phonon_bigrun_v0/asr_mid_half1.jsonl
    - /data/phonon_bigrun_v0/asr_big_half0.jsonl
    - /data/phonon_bigrun_v0/asr_big_half1.jsonl
  zero_edit_cap: 0.30
  seed: 7
  id_prefix: big_
  source: tts_parakeet
  stages: {mid: [0, 4], big: [4, 8]}

lists:
  retriever: v1
  sources:
    - /data/phonon_synth_v0/lexicon_ranked.jsonl
    - /data/phonon_term_eval_v0/terms_heldout.jsonl
    - /data/phonon_bigrun_v0/terms_heldout_new.jsonl
  dumps:
    - {rows: /data/phonon_corrector_v0/datesplit/train_date.jsonl, key: input, k: 30, out: lists_real.jsonl}
    - {rows: /data/phonon_harness/bigrun_mid/acoustic_pool.jsonl, key: input, k: 31, out: lists_acoustic.jsonl}

mix:
  out: train_mid.jsonl
  topk: 30
  p_noline: 0.20
  p_restraint: 0.30
  seed: 918
  acoustic:
    pool: /data/phonon_bigrun_v0/acoustic_pool.jsonl
    lists: /data/phonon_bigrun_v0/lists_acoustic.jsonl
    seed_tag: v1ac
    source: tts_parakeet
    filter: {stage: mid}
  real:
    rows: /data/phonon_corrector_v0/datesplit/train_date.jsonl
    lists: /data/phonon_bigrun_v0/lists_real.jsonl
    seed_tag: v1real
    repeats: 4
