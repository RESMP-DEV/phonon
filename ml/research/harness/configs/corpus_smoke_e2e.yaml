# Tiny end-to-end corpus: 24 terms -> 2 sentences each -> Kokoro -> Parakeet -> training rows.
# Exercises every stage on one GPU in a few minutes; the numerics are the bigrun ones.
name: smoke_e2e
out_dir: /data/phonon_harness/smoke_e2e
lexicon: /data/phonon_synth_v0/lexicon_ranked.jsonl
heldout:
  - /data/phonon_term_eval_v0/terms_heldout.jsonl
  - /data/phonon_bigrun_v0/terms_heldout_new.jsonl
stages: [sentences, jobs, tts, asr, pool, lists, mix]

sentences:
  terms: /data/phonon_harness/smoke_e2e/terms_24.jsonl
  out: /data/phonon_harness/smoke_e2e/sentences.jsonl
  per_term: 2
  rounds: 2
  batch_size: 24
  seed: 918
  gpu: 1
  agent: opus-harness

jobs:
  terms: /data/phonon_harness/smoke_e2e/terms_24.jsonl
  sentences: /data/phonon_harness/smoke_e2e/sentences.jsonl
  halves: 1
  stages:
    mid: {sidx: [0, 2], voice_offset: 0, n_voices: 2}

tts:
  workers: 4
  shards: [{stage: mid, half: 0, gpu: 1}]

asr:
  batch_size: 48
  shards: [{stage: mid, half: 0, gpu: 1}]

pool:
  asr: [/data/phonon_harness/smoke_e2e/asr_mid_half0.jsonl]
  zero_edit_cap: 0.30
  seed: 7
  id_prefix: sm_
  stages: {mid: [0, 2]}

lists:
  retriever: v1
  sources:
    - /data/phonon_harness/smoke_e2e/terms_24.jsonl
    - /data/phonon_term_eval_v0/terms_heldout.jsonl
  dumps:
    - {rows: /data/phonon_harness/smoke_e2e/acoustic_pool.jsonl, key: input, k: 31, out: lists_acoustic.jsonl}

mix:
  out: train_smoke.jsonl
  topk: 30
  p_noline: 0.20
  p_restraint: 0.30
  seed: 918
  acoustic:
    pool: /data/phonon_harness/smoke_e2e/acoustic_pool.jsonl
    lists: /data/phonon_harness/smoke_e2e/lists_acoustic.jsonl
    seed_tag: v1ac
    source: tts_parakeet
