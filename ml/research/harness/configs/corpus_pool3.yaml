# pool3_v0 as a config: the same recipe plus two replay mixes and the real rows x4 lifted out
# of the pool-1 file (research/pool3_v0/step4c_mix3.py).
name: pool3
out_dir: /data/phonon_harness/pool3
lexicon: /data/phonon_synth_v0/lexicon_ranked.jsonl
heldout:
  - /data/phonon_term_eval_v0/terms_heldout.jsonl
  - /data/phonon_bigrun_v0/terms_heldout_new.jsonl
  - /data/phonon_pool2_v0/terms_heldout_pool2.jsonl
  - /data/phonon_pool3_v0/terms_heldout_pool3.jsonl
stages: [pool, lists, mix]
pool:
  asr: [/data/phonon_pool3_v0/asr_pool_s*.jsonl]
  zero_edit_cap: 0.30
  seed: 7
  id_prefix: p3_
  stages: pool3
lists:
  retriever: v1
  sources:
    - /data/phonon_synth_v0/lexicon_ranked.jsonl
    - /data/phonon_term_eval_v0/terms_heldout.jsonl
    - /data/phonon_bigrun_v0/terms_heldout_new.jsonl
    - /data/phonon_pool2_v0/terms_pool2.jsonl
    - /data/phonon_pool2_v0/terms_heldout_pool2.jsonl
    - /data/phonon_pool3_v0/terms_pool3.jsonl
    - /data/phonon_pool3_v0/terms_heldout_pool3.jsonl
  dumps:
    - {rows: /data/phonon_harness/pool3/acoustic_pool.jsonl, key: input, k: 31, out: lists_acoustic3.jsonl}
mix:
  out: train_pool3.jsonl
  topk: 30
  p_noline: 0.20
  p_restraint: 0.30
  seed: 3918
  acoustic:
    pool: /data/phonon_pool3_v0/acoustic_pool3.jsonl
    lists: /data/phonon_pool3_v0/lists_acoustic3.jsonl
    seed_tag: v1ac3
    source: tts_parakeet_pool3
  replay:
    - {path: /data/phonon_pool2_v0/train_pool2.jsonl, match_source: tts_parakeet_pool2,
       fraction: 0.25, seed: 3918, rename_source: tts_parakeet_replay_p2}
    - {path: /data/phonon_bigrun_v0/train_big.jsonl, match_source: tts_parakeet,
       fraction: 0.15, seed: 3919, rename_source: tts_parakeet_replay_p1,
       take_real: {repeats: 4}}
