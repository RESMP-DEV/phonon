# Two-GPU dispatch check that costs the co-tenant nothing: one probe per GPU, run at the same
# time, each printing the device the scheduler handed it.
run: harness_gpu_probe
gpus: [0, 1]
slots_per_gpu: 1
jobs:
  - {name: probe_gpu0, kind: shell, gpu: 0,
     command: 'nvidia-smi --query-gpu=index,name,memory.used --format=csv,noheader && echo CUDA_VISIBLE_DEVICES=$CUDA_VISIBLE_DEVICES && sleep 20'}
  - {name: probe_gpu1, kind: shell, gpu: 1,
     command: 'nvidia-smi --query-gpu=index,name,memory.used --format=csv,noheader && echo CUDA_VISIBLE_DEVICES=$CUDA_VISIBLE_DEVICES && sleep 20'}
  - {name: after_both, kind: shell, gpu: any, needs: [probe_gpu0, probe_gpu1],
     command: 'echo both probes finished'}
