[project]
name = "phonon-bench"
version = "0.1.0"
description = "One benchmark for the Phonon refiner: quality, retrieval, numerics, latency."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.3",
  "jiwer==4.0.0",
  "whisper-normalizer==0.1.15",
  "rapidfuzz==3.14.6",
  "metaphone==0.6",
  "torch==2.14.0",
  "transformers==5.17.0",
  "peft==0.21.0",
  "accelerate==1.15.0",
  "safetensors>=0.6",
]

[project.optional-dependencies]
mlx = ["mlx-lm==0.31.3"]
mlx-cuda = ["mlx-lm==0.31.3", "mlx[cuda13]==0.32.2"]
lfm2 = ["causal-conv1d>=1.5"]
vllm = ["vllm"]
g2p = ["g2p-en>=2.1.0"]

[project.scripts]
phonon-bench = "phonon_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phonon_bench"]
