# Windows ship candidate: same data, Qwen3-1.7B.
kind: train
name: ship_qwen17_v0
model: Qwen/Qwen3-1.7B
train: /data/phonon_restraint_v0/train_b.jsonl
dev: /data/phonon_corrector_v0/dev.jsonl
epochs: 2
lr: 2.0e-4
lora_r: 16
lora_dropout: 0.05
batch_size: 8
grad_accum: 2      # effective batch 16. Qwen3-1.7B at batch 16 peaked at 60.3 GB and only
                   # 49 GB per card is free while the root GLM-5.3 vLLM server holds 47.9 GB.
max_seq_len: 1024
dataloader_workers: 4
group_by_length: "on"
corpus: restr_real12 (164325 acoustic train_mid + 45924 train_date x12)
