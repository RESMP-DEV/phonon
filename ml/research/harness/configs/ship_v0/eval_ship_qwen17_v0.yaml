# vLLM is the fast backend (63.7 s for the full six-set run against 241.5 s on hf) and agrees
# with hf to 0.0002 fair WER; retriever recall is adapter-independent and is measured once in
# the retrieval_mp job, so this run skips the retrieval and numerics stages.
# --gpu-frac 0.30: a root-owned GLM-5.3 vLLM server (TP4) has held 47.9 GB of every card
# since 21:46, so the default 0.85 cannot be allocated.
kind: eval
adapter: /data/phonon_corrector_v0/adapters/ship_qwen17_v0
label: ship_ship_qwen17_v0
backend: vllm
exe: /data/venvs/vllm/bin/phonon-bench
sets: [real_580, term_old_seen, term_old_unseen, term_new, term_pool2, term_pool3]
extra: ["--no-retrieval", "--no-numerics", "--max-batch", "96", "--gpu-frac", "0.30"]
