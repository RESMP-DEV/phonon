# The same validation with one train per GPU: what to run when both GPUs are free.
run: harness_smoke_2gpu
agent: opus-harness
gpus: [0, 1]
slots_per_gpu: 1
max_attempts: 2
jobs:
  - {name: train_a, kind: train, gpu: 1, config: research/harness/configs/train_smoke_a.yaml}
  - {name: train_b, kind: train, gpu: 0, config: research/harness/configs/train_smoke_b.yaml}
  - {name: eval_a, kind: eval, gpu: 1, needs: [train_a], config: research/harness/configs/eval_smoke_a.yaml}
  - {name: eval_b, kind: eval, gpu: 0, needs: [train_b], config: research/harness/configs/eval_smoke_b.yaml}
