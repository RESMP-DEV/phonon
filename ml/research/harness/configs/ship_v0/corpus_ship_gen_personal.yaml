# Stage 2 of the private-user path: the user's own pairs once, plus a 25 percent replay of the
# generic acoustic rows so the personal stage does not overwrite the term skill.
name: ship_gen_personal
out_dir: /data/phonon_harness/ship_gen_personal
lexicon: /data/phonon_synth_v0/lexicon_ranked.jsonl
heldout:
  - /data/phonon_term_eval_v0/terms_heldout.jsonl
  - /data/phonon_bigrun_v0/terms_heldout_new.jsonl
stages: [mix]
mix:
  out: /data/phonon_harness/ship_gen_personal/train_gen_personal.jsonl
  topk: 30
  p_noline: 0.20
  p_restraint: 0.30
  seed: 918
  replay:
    - {path: /data/phonon_bigrun_v0/train_mid_generic.jsonl, match_source: tts_parakeet,
       fraction: 0.25, seed: 918}
  real:
    rows: /data/phonon_corrector_v0/datesplit/train_date.jsonl
    lists: /data/phonon_bigrun_v0/lists_real.jsonl
    seed_tag: v1real
    repeats: 1
