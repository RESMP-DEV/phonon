# The xl continue-train corpus (research/pool2_v0/step4c_mix.py) with the real rows at x8
# instead of x4: pool-2 acoustic rows + 25 percent replay of the pool-1 acoustic rows
# + train_date x8. Mix stage only; the pool and the lists were built by pool2_v0.
name: ship_wide
out_dir: /data/phonon_harness/ship_wide
lexicon: /data/phonon_synth_v0/lexicon_ranked.jsonl
heldout:
  - /data/phonon_term_eval_v0/terms_heldout.jsonl
  - /data/phonon_bigrun_v0/terms_heldout_new.jsonl
  - /data/phonon_pool2_v0/terms_heldout_pool2.jsonl
  - /data/phonon_pool3_v0/terms_heldout_pool3.jsonl
stages: [mix]
mix:
  out: /data/phonon_harness/ship_wide/train_wide.jsonl
  topk: 30
  p_noline: 0.20
  p_restraint: 0.30
  seed: 2918
  acoustic:
    pool: /data/phonon_pool2_v0/acoustic_pool2.jsonl
    lists: /data/phonon_pool2_v0/lists_acoustic2.jsonl
    seed_tag: v1ac2
    source: tts_parakeet_pool2
  replay:
    - {path: /data/phonon_bigrun_v0/train_big.jsonl, match_source: tts_parakeet,
       fraction: 0.25, seed: 2918, rename_source: tts_parakeet_replay_p1}
  real:
    rows: /data/phonon_corrector_v0/datesplit/train_date.jsonl
    lists: /data/phonon_bigrun_v0/lists_real.jsonl
    seed_tag: v1real
    repeats: 8
