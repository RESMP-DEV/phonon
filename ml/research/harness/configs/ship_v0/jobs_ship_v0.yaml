# The ship-candidate queue: four GPUs, one DAG, one run.
run: ship_v0
gpus: [0, 1, 2, 3]
slots_per_gpu: 1
cpu_slots: 3
agent: opus-ship
max_attempts: 3

jobs:
  # ---- corpora (CPU; they hold no card) --------------------------------------------
  - {name: corpus_wide, kind: corpus, gpu: cpu, timeout_s: 5400,
     config: research/harness/configs/ship_v0/corpus_ship_wide.yaml}
  - {name: corpus_gen_personal, kind: corpus, gpu: cpu, timeout_s: 3600,
     config: research/harness/configs/ship_v0/corpus_ship_gen_personal.yaml}

  # ---- reference benchmarks (GPU 3 is free while the three first trains run) --------
  - {name: bench_bigrun_mid_r16, kind: eval, gpu: 3, timeout_s: 3600,
     config: research/harness/configs/ship_v0/eval_bigrun_mid_r16.yaml}
  - {name: bench_restr_real12, kind: eval, gpu: 3, timeout_s: 3600,
     config: research/harness/configs/ship_v0/eval_restr_real12.yaml}

  # ---- trains ----------------------------------------------------------------------
  - {name: ship_lfm12, kind: train, gpu: 0, timeout_s: 21600,
     config: research/harness/configs/ship_v0/train_ship_lfm12.yaml}
  - {name: ship_qwen17, kind: train, gpu: 1, timeout_s: 21600,
     config: research/harness/configs/ship_v0/train_ship_qwen17.yaml}
  - {name: ship_lfm12_gen, kind: train, gpu: 2, timeout_s: 21600,
     config: research/harness/configs/ship_v0/train_ship_lfm12_gen.yaml}
  - {name: ship_lfm12_gen_personal, kind: train, gpu: 2, timeout_s: 7200,
     needs: [ship_lfm12_gen, corpus_gen_personal],
     config: research/harness/configs/ship_v0/train_ship_lfm12_gen_personal.yaml}
  - {name: ship_lfm12_wide, kind: train, gpu: 0, timeout_s: 21600,
     needs: [ship_lfm12, corpus_wide],
     config: research/harness/configs/ship_v0/train_ship_lfm12_wide.yaml}

  # ---- retrieval: multiprocess the two-stage rerank, verify and time it ------------
  # CPU-bound; it waits for the three long trains so its timing is not measured against
  # 4 saturated dataloaders.
  - {name: retrieval_mp, kind: shell, gpu: cpu, timeout_s: 7200,
     needs: [ship_lfm12, ship_qwen17, ship_lfm12_gen],
     command: bash /data/phonon_ship_v0/scripts/retrieval_mp.sh}

  # ---- ship benchmarks -------------------------------------------------------------
  - {name: bench_ship_lfm12, kind: eval, gpu: 3, timeout_s: 3600, needs: [ship_lfm12],
     config: research/harness/configs/ship_v0/eval_ship_lfm12_v0.yaml}
  - {name: bench_ship_qwen17, kind: eval, gpu: 3, timeout_s: 3600, needs: [ship_qwen17],
     config: research/harness/configs/ship_v0/eval_ship_qwen17_v0.yaml}
  - {name: bench_ship_lfm12_gen, kind: eval, gpu: 3, timeout_s: 3600,
     needs: [ship_lfm12_gen], config: research/harness/configs/ship_v0/eval_ship_lfm12_generic_v0.yaml}
  - {name: bench_ship_lfm12_gen_personal, kind: eval, gpu: 3, timeout_s: 3600,
     needs: [ship_lfm12_gen_personal],
     config: research/harness/configs/ship_v0/eval_ship_lfm12_generic_personal_v0.yaml}
  - {name: bench_ship_lfm12_wide, kind: eval, gpu: 3, timeout_s: 3600,
     needs: [ship_lfm12_wide], config: research/harness/configs/ship_v0/eval_ship_lfm12_wide_v0.yaml}

  # ---- quantization: merge, MLX custom_attn6emb8, GGUF IQ4_XS, numerics -------------
  - {name: quant_lfm12, kind: shell, gpu: 2, timeout_s: 10800,
     needs: [bench_ship_lfm12],
     command: bash /data/phonon_ship_v0/scripts/quant.sh ship_lfm12_v0}
  - {name: quant_lfm12_wide, kind: shell, gpu: 2, timeout_s: 10800,
     needs: [bench_ship_lfm12_wide, quant_lfm12],
     command: bash /data/phonon_ship_v0/scripts/quant.sh ship_lfm12_wide_v0}

  # ---- the bench retrieval stage, re-timed inside a real run ----------------------
  - {name: bench_retrieval_check, kind: eval, gpu: 3, timeout_s: 5400,
     needs: [retrieval_mp, bench_ship_lfm12],
     config: research/harness/configs/ship_v0/eval_retrieval_check.yaml}
